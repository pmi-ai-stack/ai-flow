name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: every job here only reads the repository. A job that
# ever needs more gets its own job-level grant, never a wider default.
permissions:
  contents: read

jobs:
  plugin-required:
    name: Plugin required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: shellcheck hooks
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "./hooks"
          severity: warning

      - name: shellcheck CI scripts
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "./.github/scripts"
          severity: warning

      # Phase 33 (SEC-11): every third-party action is pinned to a commit
      # SHA (dependabot moves the pins) and every workflow declares its
      # own least-privilege permissions. The CLI repository enforces the
      # same rule with TestWorkflowsPinActionsBySHA.
      - name: actions pinned by SHA, permissions declared
        run: |
          set -eu
          bad="$(grep -rhoE '^\s*(- )?uses:\s*\S+' .github | sed -E 's/.*uses:\s*//' \
            | grep -vE '^\./' | grep -vE '@[0-9a-f]{40}$' || true)"
          if [ -n "$bad" ]; then echo "::error::not pinned to a commit SHA:"; echo "$bad"; exit 1; fi
          for f in .github/workflows/*.yml; do
            grep -q '^permissions:' "$f" || { echo "::error::$f has no top-level permissions: block"; exit 1; }
          done

      # The bootstrap comparison session-start.sh runs on every session:
      # a regression here either reinstalls on every turn (dev build) or
      # never installs (released build), both silently.
      - name: cli-version.sh range and pin checks
        run: |
          set -eu
          . ./hooks/cli-version.sh
          expect() { if range_satisfied "$2" "$3"; then got=in; else got=out; fi
            [ "$got" = "$1" ] || { echo "::error::range_satisfied '$2' '$3' = $got, want $1"; exit 1; }; }
          expect in  dev      ">=0.2 <0.3"
          expect in  "(devel)" ">=0.2 <0.3"
          expect in  0.2.0    ">=0.2 <0.3"
          expect in  v0.2.4   ">=0.2 <0.3"
          expect out 0.1.9    ">=0.2 <0.3"
          expect out 0.3.0    ">=0.2 <0.3"
          echo "$INSTALL_SH_SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error file=hooks/cli-version.sh::INSTALL_SH_SHA must be a full 40-hex commit SHA, never a branch"; exit 1; }

      # AI_FLOW_REQUIRE_SIGNATURE=1 must turn into install.sh's -s, and
      # nothing else may (2026-10-04 security review #6).
      - name: run_install_sh signature opt-in
        run: sh .github/scripts/run-install-sh-test.sh "$PWD"

      - name: JSON validity — manifests and hooks
        run: |
          set -eu
          for f in \
            .claude-plugin/plugin.json \
            .claude-plugin/marketplace.json \
            .cursor-plugin/plugin.json \
            hooks/claude-code.json \
            hooks/cursor.json \
            docs/terminology.json; do
            echo "checking $f"
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done

      # ai-flow skills lint .: cli_version is a real pinned range (as of
      # phase 29, ">=0.2 <0.3"), so the spec's own words apply — install
      # the release that range names, the same way session-start.sh does
      # for a real plugin install, rather than building from source.
      - name: Install the pinned ai-flow-cli release
        uses: ./.github/actions/install-pinned-cli

      - name: ai-flow skills lint .
        run: ai-flow skills lint .

      # CI gates table, Plugin required row: the recorded host payloads
      # round-trip through parse, guard and encode for both hosts.
      - name: ai-flow hook selftest --host claude-code
        run: ai-flow hook selftest --host claude-code

      - name: ai-flow hook selftest --host cursor
        run: ai-flow hook selftest --host cursor

  # Plugin evals runs skills evals . — a separate job from
  # plugin-required, deliberately: a missing ANTHROPIC_API_KEY
  # repository secret (every fork PR, by construction — a fork never
  # has access to a base repository's secrets) must never block the
  # required job. skills evals itself already turns that absence into
  # ok:true / result.skipped:true (never a failing envelope, per the
  # Evals section's own words), so the `if:` below is belt-and-braces:
  # it skips the whole job on a fork PR rather than spend CI minutes on
  # a run the CLI would immediately report as skipped anyway. Per the
  # CI gates table, this phase wires only the PR (non-fork), single-cell
  # (Claude Code, Sonnet 5) job; the nightly and weekly matrices are
  # phase 30's ("defined but activated in phase 30").
  plugin-evals:
    name: Plugin evals
    runs-on: ubuntu-latest
    # Dependabot PRs are same-repository but run without repository
    # secrets, so they are excluded like forks — otherwise
    # --require-credentials below would fail every one of them.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the pinned ai-flow-cli release
        uses: ./.github/actions/install-pinned-cli

      - name: ai-flow skills evals .
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # --require-credentials: this job only runs where the secret
        # should exist, so a missing key is a misconfiguration to fail on,
        # not the fork-PR skip the CLI otherwise reports as ok.
        run: |
          set -o pipefail
          ai-flow skills evals . --require-credentials --out "$RUNNER_TEMP/evals" | tee "$RUNNER_TEMP/evals-envelope.json"

      # Wave 4 (phase 35): one unmistakable verdict per run — SKIPPED,
      # PASSED or FAILED — in the run's summary page, never a green tick
      # for a run in which nothing ran.
      - name: Eval summary
        if: always()
        run: .github/scripts/evals-summary.sh "$RUNNER_TEMP/evals-envelope.json" "$RUNNER_TEMP/evals/results.json" "Plugin evals — Claude Code × Sonnet 5"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-results
          path: ${{ runner.temp }}/evals/results.json
          if-no-files-found: ignore
