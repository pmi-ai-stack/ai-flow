name: Install pinned ai-flow-cli release
description: >-
  Resolves this plugin's cli_version range (.claude-plugin/plugin.json)
  to a published ai-flow-cli release tag via hooks/cli-version.sh —
  the same range-resolution session-start.sh uses for a real plugin
  install — and installs it onto PATH. Used identically by every CI job
  that needs the CLI, so they can never resolve "pinned" differently.
runs:
  using: composite
  steps:
    # install.sh -s below makes the checksums.txt signature check
    # mandatory, so cosign must be on PATH: a CI job must never fall back
    # to checksum-only verification.
    - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      with:
        cosign-release: v2.4.1

    - name: Install the pinned ai-flow-cli release
      shell: bash
      run: |
        set -eu
        . ./hooks/cli-version.sh
        cli_version="$(read_cli_version .claude-plugin/plugin.json)"
        pinned_tag="$(resolve_pinned_tag "$cli_version")"
        if [ -z "$pinned_tag" ]; then
          echo "::error::no published ai-flow-cli release satisfies cli_version '${cli_version}' — cut that release, or point cli_version at one that already exists"
          exit 1
        fi
        echo "installing ai-flow-cli ${pinned_tag} (cli_version ${cli_version})"
        run_install_sh -v "$pinned_tag" -d "$RUNNER_TEMP/bin" -s
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
