name: Weekly eval matrix

# Phase 30 activates the CI gates table's own weekly cell: "the full
# matrix Haiku 4.5 / Sonnet 5 / Opus 5 and, from P8, Cursor default
# weekly; pass rate ≥ 90 % per host, every temptation scenario passing
# on every model." Cursor is not in the matrix below for the identical,
# still-open reason nightly.yml's own header names (`agent -p`'s
# headless flags remain unverified) — add a `host: cursor` matrix leg
# the day that sentinel error is retired, with no other change needed.
#
# internal/skills/evals.Summary.Failing (ai-flow-cli) already is the
# ">= 90% and every temptation scenario" gate — `skills evals` exits 6
# (invalid_result) the moment either condition fails on any one model,
# so this workflow needs no separate threshold-checking step of its
# own: a red matrix cell already means "this model failed the bar."

on:
  schedule:
    - cron: "0 5 * * 1" # 05:00 UTC every Monday
  workflow_dispatch: {}

# Least privilege: every job here only reads the repository. A job that
# ever needs more gets its own job-level grant, never a wider default.
permissions:
  contents: read

jobs:
  weekly-eval-matrix:
    name: Every skill × Claude Code × ${{ matrix.model }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model:
          - claude-haiku-4-5-20251001
          - claude-sonnet-5
          - claude-opus-5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned ai-flow-cli release
        uses: ./.github/actions/install-pinned-cli

      - name: ai-flow skills evals .
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Scheduled: the secret must exist, so a missing key fails the run
        # instead of skipping it green (phase 35).
        run: |
          set -o pipefail
          ai-flow skills evals . --host claude-code --model ${{ matrix.model }} --require-credentials --out "$RUNNER_TEMP/evals" | tee "$RUNNER_TEMP/evals-envelope.json"

      # Wave 4 (phase 35): one unmistakable verdict per run — SKIPPED,
      # PASSED or FAILED — in the run's summary page, never a green tick
      # for a run in which nothing ran.
      - name: Eval summary
        if: always()
        run: .github/scripts/evals-summary.sh "$RUNNER_TEMP/evals-envelope.json" "$RUNNER_TEMP/evals/results.json" "Weekly evals — Claude Code × ${{ matrix.model }}"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weekly-eval-results-claude-code-${{ matrix.model }}
          path: ${{ runner.temp }}/evals/results.json
          if-no-files-found: ignore
