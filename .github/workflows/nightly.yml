name: Nightly evals

# Phase 30 activates the CI gates table's own nightly cell: "every
# skill, one model each nightly (both hosts once Cursor headless runs,
# from P8)". Cursor headless stays off here — internal/skills/evals's
# own cursorRunner still returns ErrHostUnverified in ai-flow-cli as of
# this phase (`agent -p`'s headless prompt/working-directory/model
# flags remain unverified in every development environment this
# workspace's phases have run in; see `.ai/phase-30/plan.md`'s own
# Cursor section for the evidence looked for and not found) — so this
# job runs the one cell that is real today, Claude Code only, and gains
# a Cursor row the moment that sentinel error is retired, with no other
# change needed here.

on:
  schedule:
    - cron: "43 4 * * *" # 04:43 UTC — off the hour, distinct from ai-flow-cli's own nightly slot
  workflow_dispatch: {}

# Least privilege: every job here only reads the repository. A job that
# ever needs more gets its own job-level grant, never a wider default.
permissions:
  contents: read

jobs:
  nightly-evals-claude-code:
    name: Every skill × Claude Code × Sonnet 5
    runs-on: ubuntu-latest
    # Every skill, not just PR-changed ones (unlike the required
    # plugin-evals job) — the CI gates table's own nightly line is
    # explicitly broader than the PR one for this reason.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the pinned ai-flow-cli release
        uses: ./.github/actions/install-pinned-cli

      - name: ai-flow skills evals .
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Scheduled: the secret must exist, so a missing key fails the run
        # instead of skipping it green (phase 35).
        run: |
          set -o pipefail
          ai-flow skills evals . --host claude-code --model claude-sonnet-5 --require-credentials --out "$RUNNER_TEMP/evals" | tee "$RUNNER_TEMP/evals-envelope.json"

      # Wave 4 (phase 35): one unmistakable verdict per run — SKIPPED,
      # PASSED or FAILED — in the run's summary page, never a green tick
      # for a run in which nothing ran.
      - name: Eval summary
        if: always()
        run: .github/scripts/evals-summary.sh "$RUNNER_TEMP/evals-envelope.json" "$RUNNER_TEMP/evals/results.json" "Nightly evals — Claude Code × Sonnet 5"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-eval-results-claude-code-sonnet-5
          path: ${{ runner.temp }}/evals/results.json
          if-no-files-found: ignore
